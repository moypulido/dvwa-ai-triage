# Scope Scan — Phase 2 skeleton (step 1 of 6).
# On every PR to main: check out full history and print the commit range.
# No scanning yet; later steps add scope filtering, gitleaks, Semgrep, Trivy,
# normalization and the evidence artifact.
#
# Uses `pull_request` (NOT `pull_request_target`): PRs from forks run with no
# secrets and a read-only token, which avoids the "pwn request" class of attack.
name: Scope Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scope-scan:
    # Pinned runner image (not ubuntu-latest) for reproducibility.
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit SHA (not tag): a tag can be moved to a malicious
      # commit. Re-verify this SHA still maps to a trusted release.
      - name: Checkout (full history)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Resolve PR commit range
        id: range
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Diff against the branch point (merge-base), not the current main,
          # so unrelated changes merged into main meanwhile are not pulled in.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "Base branch tip : $BASE_SHA"
          echo "PR head         : $HEAD_SHA"
          echo "Branch point    : $MERGE_BASE"
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "merge_base=$MERGE_BASE"
          } >> "$GITHUB_OUTPUT"

      # Step 2: restrict the PR's changed files to the approved scope.
      # Writes scan/in_scope.txt (consumed by Semgrep/Trivy in later steps)
      # and prints both the changed list and the in-scope list.
      - name: Filter changed files to approved scope
        id: scope
        env:
          MERGE_BASE: ${{ steps.range.outputs.merge_base }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p scan

          # Changed files in the PR, excluding deletions (nothing to scan in
          # a file that no longer exists). --diff-filter=d drops Deleted.
          git diff --name-only --diff-filter=d "$MERGE_BASE" "$HEAD_SHA" \
            > scan/changed.txt
          echo "== Changed files in PR (non-deleted) =="
          cat scan/changed.txt || true

          # Load scope entries, skipping comments and blank lines.
          mapfile -t SCOPE < <(grep -vE '^[[:space:]]*(#|$)' .security/scope.txt)

          : > scan/in_scope.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            for entry in "${SCOPE[@]}"; do
              case "$entry" in
                */)  # directory prefix, e.g. vulnerabilities/sqli/
                  case "$f" in
                    "$entry"*) echo "$f" >> scan/in_scope.txt; break ;;
                  esac ;;
                *)   # exact file, e.g. Dockerfile
                  if [ "$f" = "$entry" ]; then
                    echo "$f" >> scan/in_scope.txt; break
                  fi ;;
              esac
            done
          done < scan/changed.txt

          echo "== In-scope files =="
          cat scan/in_scope.txt || true

          IN_SCOPE_COUNT="$(grep -c . scan/in_scope.txt || true)"
          echo "in_scope_count=$IN_SCOPE_COUNT" >> "$GITHUB_OUTPUT"
          echo "In-scope file count: $IN_SCOPE_COUNT"

      # Step 3: secret scan with gitleaks over the PR's commit range.
      # Pinned version; binary downloaded from the official release and verified
      # against the release checksums file. Re-verify the version periodically.
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Save the tarball under its real asset name so the checksum line
          # (which lists that exact name) matches during verification.
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            || curl -fsSL -o checksums.txt "${base}/checksums.txt"
          # Verify the tarball against the release checksums (fails on mismatch).
          grep "$tarball" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans the whole PR commit range, NOT just in-scope files: a leaked
      # secret matters wherever it lands. --redact keeps secret values out of
      # logs and the report. --exit-code 0 so findings never fail the step;
      # a non-zero exit then means gitleaks itself broke, which fails the run.
      - name: gitleaks (secret scan)
        env:
          MERGE_BASE: ${{ steps.range.outputs.merge_base }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p scan
          gitleaks git . \
            --log-opts="${MERGE_BASE}..${HEAD_SHA}" \
            --redact \
            --report-format sarif \
            --report-path scan/gitleaks.sarif \
            --exit-code 0
          COUNT="$(jq '[.runs[].results[]?] | length' scan/gitleaks.sarif)"
          echo "gitleaks findings: $COUNT"

      # Step 4: SAST with Semgrep over the in-scope changed files only.
      # Rulesets p/php + p/security-audit are pulled from the registry (needs
      # network, available on Actions). `semgrep scan` exits 0 on findings by
      # default, so findings never fail the step; a tool error does fail it.
      - name: Install semgrep (pinned)
        run: pipx install semgrep==1.183.0

      - name: semgrep (SAST on in-scope changes)
        run: |
          set -euo pipefail
          mkdir -p scan
          semgrep --version
          # Nothing in scope changed -> write an empty SARIF so later steps
          # always have a report to read, and skip the scan.
          if [ ! -s scan/in_scope.txt ]; then
            echo "No in-scope files changed; writing empty SARIF."
            echo '{"version":"2.1.0","runs":[]}' > scan/semgrep.sarif
            exit 0
          fi
          mapfile -t TARGETS < scan/in_scope.txt
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --sarif --output scan/semgrep.sarif \
            --metrics off \
            "${TARGETS[@]}"
          COUNT="$(jq '[.runs[].results[]?] | length' scan/semgrep.sarif)"
          echo "semgrep findings: $COUNT"
